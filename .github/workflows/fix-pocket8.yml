name: Fix Pocket8 metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'SerialfireLewis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source.json')
          s=json.loads(p.read_text())
          for a in s['apps']:
              if a.get('bundleIdentifier') == 'com.jevonlipsey.pocket8':
                  a['iconURL']='https://raw.githubusercontent.com/jevonlipsey/pico-ios/refs/heads/main/assets/icon.png'
                  a['tintColor']='#8e2de2'
                  a['appPermissions']={'backgroundAudio':False,'backgroundFetch':False,'photos':False}
                  a['versions'][0]['buildVersion']='11'
          p.write_text(json.dumps(s,separators=(',',':'),ensure_ascii=False)+'\n')
          PY
          rm -f .github/workflows/fix-pocket8.yml
          git config user.name 'SerialfireLewis'
          git config user.email '151228894+SerialfireLewis@users.noreply.github.com'
          git add source.json .github/workflows/fix-pocket8.yml
          git commit -m 'Fix Pocket8 metadata' || exit 0
          git push
