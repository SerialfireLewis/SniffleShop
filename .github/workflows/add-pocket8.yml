name: Add Pocket8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor == 'SerialfireLewis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Pocket8
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('source.json')
          s=json.loads(p.read_text())
          apps=s['apps']
          bid='com.jevonlipsey.pocket8'
          if not any(a.get('bundleIdentifier')==bid for a in apps):
              apps.append({'name':'Pocket8','bundleIdentifier':bid,'developerName':'Jevon Lipsey','subtitle':'Native PICO-8 emulator for iOS','localizedDescription':'Pocket8 is a native PICO-8 emulator for iPhone and iPad. It supports .p8 and .p8.png cartridges, responsive touch controls, controller input, save states, and a unified cartridge library. It can run Celeste Classic and Celeste Classic 2.','iconURL':'https://raw.githubusercontent.com/jevonlipsey/pico-ios/main/public/icon.png','tintColor':'#111111','category':'games','versions':[{'version':'1.6.2','date':'2026-01-22T23:33:34Z','downloadURL':'https://github.com/jevonlipsey/pico-ios/releases/download/v1.6.2/pocket8.ipa','size':19479747,'minOSVersion':'15.0','sha256':'b6c1003801ac5368a45dc3e10a7a752e08fc24da13b57bbe7a275ae5432a0504','localizedDescription':'v1.6.2 hotfix from the official Pocket8 GitHub release.'}]})
          if bid not in s.get('featuredApps',[]): s.setdefault('featuredApps',[]).append(bid)
          p.write_text(json.dumps(s,separators=(',',':'),ensure_ascii=False)+'\n')
          r=Path('README.md').read_text()
          b='- **Pocket8** — native PICO-8 emulator for iPhone and iPad; runs `.p8`/`.p8.png` cartridges including Celeste Classic and Celeste Classic 2.'
          if b not in r: r=r.replace('- **MAME4iOS** — arcade emulator with deterministic input recording/playback and single-step support for TAS-style work.','- **MAME4iOS** — arcade emulator with deterministic input recording/playback and single-step support for TAS-style work.\n'+b)
          Path('README.md').write_text(r)
          u=Path('UPSTREAMS.md').read_text()
          row='| Pocket8 | 1.6.2 | https://github.com/jevonlipsey/pico-ios/releases | Official iOS IPA; supports PICO-8 cartridges including Celeste Classic. |'
          if row not in u: u=u.replace('| RetroArch | 1.22.2 | https://buildbot.libretro.com/stable/1.22.2/apple/ios-arm64/ | Official Libretro stable iOS sideload IPA; current upstream release is 1.22.2. |','| RetroArch | 1.22.2 | https://buildbot.libretro.com/stable/1.22.2/apple/ios-arm64/ | Official Libretro stable iOS sideload IPA; current upstream release is 1.22.2. |\n'+row)
          Path('UPSTREAMS.md').write_text(u)
          PY
          rm -f .github/workflows/add-pocket8.yml
          git config user.name 'SerialfireLewis'
          git config user.email '151228894+SerialfireLewis@users.noreply.github.com'
          git add source.json README.md UPSTREAMS.md .github/workflows/add-pocket8.yml
          git commit -m 'Add Pocket8 and Celeste Classic support' || exit 0
          git push
